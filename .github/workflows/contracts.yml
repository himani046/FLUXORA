name: Contract checks
on:
  push:
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - 'package.json'
      - 'apps/web/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - 'package.json'
      - 'apps/web/**'
      - '.github/workflows/contracts.yml'
jobs:
  hardhat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run contracts:compile
      - run: npm run contracts:test
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package.json
      - working-directory: apps/web
        run: npm install
      - working-directory: apps/web
        run: npm run build
